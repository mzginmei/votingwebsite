services:
  db:
    image: postgres:16-alpine
    container_name: dsa-db-container
    environment:
      POSTGRES_DB: dsa-db
      POSTGRES_USER: dsa-user
      POSTGRES_PASSWORD: $DSA_DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  web:
    build: .
    container_name: dsa-web-container
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./home/web/dsa/media:/home/web/dsa/media
      - ./home/web/dsa/static:/home/web/dsa/static
    restart: unless-stopped

volumes:
  postgres_data: