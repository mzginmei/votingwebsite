{% extends "base/base.html" %}

{% block content %}
    <div class="container pb-5" dir="rtl">
        <h1 class="text-center"> Vote </h1>
        <hr>
        <form method="post">
            {% csrf_token %}

            {% if unvoted %}
                {% for comment in unvoted %}
                    <div class="border rounded p-3 mb-3" style="max-width: 700px; margin: 0 auto;">
                        <h5 class="mb-3">{{ comment.text }}</h5>

                        <div class="d-flex gap-3">
                            <label class="d-flex align-items-center gap-2 text-danger">
                                <input type="radio" name="vote_{{ comment.id }}" value="yes" required >
                                <b>Hate</b>
                            </label>

                            <label class="d-flex align-items-center gap-2">
                                <input type="radio" name="vote_{{ comment.id }}" value="no" required>
                                Non-Hate
                            </label>

                        </div>
                    </div>
                {% endfor %}

                <div class="text-center">
                    <button type="submit" class="btn btn-lg fs-4 btn-primary">Save</button>
                </div>
            {% else %}
                <p class="text-center">No comments left to vote on.</p>
            {% endif %}
        </form>
    </div>
{% endblock %}
