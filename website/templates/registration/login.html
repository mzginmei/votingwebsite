{% extends "base/base.html" %}

{% block content %}
<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #eaeaea, #8a888d);
        min-height: 100vh;
    }

    /* Hide navbar from base.html */
    .navbar {
        display: flex !important;
    }
    .auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 120px); /* keeps space for navbar */
    }   
    .container {
        background: white;
        padding: 60px;
        border-radius: 16px;
        width: 100%;
        max-width: 550px;  /* bigger */
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      
    }

    h2 {
        text-align: center;
        margin-bottom: 35px;
        font-weight: 600;
        color: #393838;
        font-size: 28px;
    }

    form p {
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 14px 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
        transition: 0.3s;
    }

    input:focus {
        border-color: #b2b6c4;
        outline: none;
        box-shadow: 0 0 0 3px rgba(81, 83, 88, 0.2);
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #8c8294, #77717e);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    .mt-3 {
        margin-top: 25px;
        text-align: center;
        font-size: 15px;
    }

    .mt-3 a {
        color: #3b3f51;
        text-decoration: none;
        font-weight: 500;
    }

    .mt-3 a:hover {
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

   <div class="auth-wrapper">
    <div class="container py-4">
      <h2>Login</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
      </form>
      <p class="mt-3 mb-0">
        No account yet? <a href="{% url 'register' %}">Register</a>
      </p>
    </div>
</div>
    
{% endblock %}
