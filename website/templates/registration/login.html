{% extends "base/base.html" %}

{% block content %}
    <div class="container py-4">
      <h2>Login</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
      </form>
      <p class="mt-3 mb-0">
        No account yet? <a href="{% url 'register' %}">Register</a>
      </p>
    </div>
{% endblock %}
